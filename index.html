<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F7F9" />
  <title>Big Little Bombaye · Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* Soft UI palette */
            app: "#F6F7F9",
            ink: "#222222",
            muted: "#999999",
            sage: {
              DEFAULT: "#8CA66B",
              dark: "#6F8A50",
              tint: "#EFF4E7"
            },
            mustard: {
              DEFAULT: "#D9A94A",
              dark: "#B98F35",
              tint: "#FBF3DF"
            },
            /* Legacy palette — kept until old components are rebuilt */
            navy: {
              DEFAULT: "#16243D",
              deep: "#101C33",
              ink: "#0B1424"
            },
            cream: "#F7F3EB",
            brass: "#B08D57",
            terra: "#9C3B2E"
          },
          fontFamily: {
            display: ["Poppins", "Nunito", "sans-serif"],
            sans: ["Nunito", "Poppins", "sans-serif"]
          },
          borderRadius: {
            btn: "50px",
            card: "24px",
            "card-sm": "20px"
          },
          boxShadow: {
            float: "0 15px 35px rgba(0, 0, 0, 0.04)",
            "float-lg": "0 25px 50px rgba(0, 0, 0, 0.06)",
            chip: "0 6px 16px rgba(34, 34, 34, 0.05)"
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/static/style.css?v=9" />
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  ::selection { background: #EFF4E7; color: #6F8A50; }

  .ornament-line { height: 1px; background: linear-gradient(to right, transparent, rgba(176,141,87,0.65), transparent); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .rise { animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both; }

  .app-height { height: 100vh; height: 100dvh; }
  @supports (-webkit-touch-callout: none) {
    .app-height { height: -webkit-fill-available; }
  }

  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .spin-slow {
    animation: spin-slow 40s linear infinite;
  }
</style>
<style>
  /* Ensure the ghost pseudo-element button is completely obliterated even if CSS is cached */
  #menu-root .menu-card::after {
    display: none !important;
    content: none !important;
  }

  /* Splash Screen Styles */
  #splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background-color: #142841; /* Navy Blue */
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
  }
  #splash-screen.hide-splash {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
  }
  #splash-logo-wrapper {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background-color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.85) translateY(20px);
    transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }
  #splash-logo-wrapper.animate-splash {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  #splash-logo {
    width: 190px;
    height: auto;
    /* optional: a slight shadow for depth inside the circle */
    filter: drop-shadow(0 4px 6px rgba(20, 40, 65, 0.08));
  }
  .app-shell {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease 0.4s, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s;
  }
  .app-shell.show-app {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>

<body class="min-h-screen bg-app font-sans text-ink antialiased">

<!-- Splash Screen -->
<div id="splash-screen">
  <div id="splash-logo-wrapper">
    <img id="splash-logo" src="/static/logo_extracted.png" alt="Big Little Bombaye" />
  </div>
</div>

<div class="app-shell">

  <!-- 1 · Header -->
  <header class="app-header">
    <a href="#" class="brand">Big Little Bombaye<span class="brand-dot">.</span></a>
    <button id="cart-open" type="button" class="avatar-btn relative" aria-label="Open your order">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
        <path d="M3 6h18"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      <span id="cart-count" class="cart-badge hidden">0</span>
    </button>
  </header>

  <!-- 2 · Hero banner (shapes sit *under* the glass so the frost blurs them) -->
  <div class="hero-wrap">
    <span class="hero-shape hero-shape--olive" aria-hidden="true"></span>
    <span class="hero-shape hero-shape--gold" aria-hidden="true"></span>
    <section class="hero-banner" aria-label="Chef's special">
      <p class="hero-eyebrow"><span class="hero-star" aria-hidden="true">&#10022;</span>Chef&rsquo;s Special</p>
      <h2 class="hero-title">Butter Chicken Spaghetti</h2>
      <p class="hero-desc">Silky makhani gravy tossed with al dente spaghetti, kasuri methi &amp; smoked chicken.</p>
      <div class="hero-foot">
        <p class="hero-price">&#8377;&nbsp;389</p>
        <button type="button" class="hero-cta" aria-label="View the chef's special">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
      </div>
    </section>
    <span class="hero-ring" aria-hidden="true"></span>
    <span class="hero-dot" aria-hidden="true"></span>
  </div>

  <!-- 3 · Search -->
  <div class="search-bar" role="search">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/>
      <path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="search" placeholder="Search our delicious menu&hellip;" aria-label="Search the menu" autocomplete="off" />
  </div>

  <!-- 4 · Categories -->
  <nav id="category-rail" class="category-rail" aria-label="Menu categories"></nav>

  <!-- 5 · Menu list (rows rendered by the existing script) -->
  <main id="menu-root" class="menu-list"></main>

  <footer class="app-footer">
    <div class="ornament-line" aria-hidden="true"></div>
    <div id="legend-root" class="mt-8"></div>
    <p class="tax-note">Prices inclusive of taxes</p>
  </footer>

</div>

<div id="item-modal"
  class="app-height fixed inset-0 z-50 flex flex-col overflow-hidden bg-app transform translate-y-full transition-transform duration-300 ease-in-out"
  role="dialog" aria-modal="true" aria-label="Dish details" aria-hidden="true">

  <button id="modal-back" type="button" aria-label="Back to menu" class="dish-back-btn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  </button>

  <div class="flex min-h-0 flex-1 flex-col overflow-y-auto overscroll-contain">
    <div class="mx-auto w-full max-w-md">

      <div class="dish-hero">
        <span class="dish-hero-glow dish-hero-glow--olive" aria-hidden="true"></span>
        <span class="dish-hero-glow dish-hero-glow--gold" aria-hidden="true"></span>
        <img id="modal-image" src="" alt="" decoding="async" class="dish-hero-plate-img spin-slow" />
      </div>

      <header class="px-6 pt-4 text-center">
        <h2 id="modal-name" class="dish-name break-words"></h2>
        <div id="modal-tags" class="mt-3 flex flex-wrap items-center justify-center gap-1.5"></div>
        <div id="modal-pricing" class="mt-3 flex items-start justify-center gap-8"></div>
      </header>

      <section class="mt-6 px-5" aria-label="Dish information">
        <div id="modal-info-grid" class="grid grid-cols-2 gap-3"></div>
      </section>

      <section class="mt-8 px-4 pb-6" aria-label="Ask the AI Butler">
        <div class="flex items-center gap-3 px-1">
          <span class="butler-avatar" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/><path d="M19 17v3"/><path d="M5 17v3"/></svg>
          </span>
          <div class="min-w-0">
            <p class="butler-title">Meet your AI Butler</p>
            <p class="butler-sub">Curious about <span id="chat-context-name" class="font-bold text-primary">this dish</span>? Ask away.</p>
          </div>
        </div>

        <div id="chat-history" class="mt-4 space-y-3 px-1" aria-live="polite"></div>
      </section>

    </div>
  </div>

  <div class="composer-bar shrink-0">
    <div class="mx-auto w-full max-w-md">
      <div id="prompt-rail" class="prompt-rail" aria-label="Suggested questions">
        <button type="button" class="prompt-pill" data-prompt="Suggest a pairing"><span class="prompt-pill-star" aria-hidden="true">&#10022;</span>Suggest a pairing</button>
        <button type="button" class="prompt-pill" data-prompt="Is this spicy?"><span class="prompt-pill-star" aria-hidden="true">&#10022;</span>Is this spicy?</button>
        <button type="button" class="prompt-pill" data-prompt="How big is the portion?"><span class="prompt-pill-star" aria-hidden="true">&#10022;</span>How big is the portion?</button>
      </div>
      <form id="chat-form" class="composer-form" autocomplete="off">
        <input id="chat-input" type="text" autocomplete="off" placeholder="Ask the butler anything&hellip;" aria-label="Ask the AI Butler" class="composer-input" />
        <button id="chat-send" type="submit" aria-label="Send message" class="composer-send">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
    </div>
  </div>
</div>


<!-- Variant Selector Bottom Sheet -->
<div id="variant-scrim" class="fixed inset-0 z-[60] bg-black/40 opacity-0 pointer-events-none transition-opacity duration-300" aria-hidden="true" onclick="closeVariantSelector()"></div>

<aside id="variant-sheet" class="fixed bottom-0 left-0 right-0 z-[70] bg-white rounded-t-[24px] shadow-[0_-10px_40px_rgba(0,0,0,0.1)] transform translate-y-full transition-transform duration-300 ease-out flex flex-col max-h-[85vh]" role="dialog" aria-modal="true" aria-labelledby="variant-title" aria-hidden="true">
  <div class="flex justify-center pt-3 pb-2 cursor-pointer" onclick="closeVariantSelector()">
    <div class="w-10 h-1.5 bg-gray-300 rounded-full"></div>
  </div>
  <header class="px-6 pb-4 border-b border-gray-100 flex items-center justify-between">
    <h3 id="variant-title" class="text-lg font-bold text-navy">Choose Variant</h3>
    <button type="button" class="text-gray-400 hover:text-gray-600 p-1" onclick="closeVariantSelector()" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
  </header>
  <div class="px-6 py-4 overflow-y-auto" id="variant-options">
    <!-- Radio buttons injected here -->
  </div>
  <div class="px-6 py-4 border-t border-gray-100">
    <button id="variant-confirm-btn" type="button" class="w-full py-3.5 bg-navy text-white font-semibold rounded-full shadow-md hover:bg-navy-deep transition-colors" onclick="confirmVariantSelection()">
      Add to Cart
    </button>
  </div>
</aside>

<!-- Toast -->
<div id="toast-container" class="fixed top-12 left-1/2 transform -translate-x-1/2 z-[100] transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
  <div class="bg-navy text-white px-5 py-2.5 rounded-full shadow-lg font-medium text-sm flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-sage"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
    <span id="toast-message">Added to cart</span>
  </div>
</div>

<!-- Cart / Order Preview -->
<div id="cart-scrim" class="cart-scrim" aria-hidden="true"></div>

<aside id="cart-drawer" class="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title" aria-hidden="true">
  <span class="cart-grabber" aria-hidden="true"></span>

  <header class="cart-header">
    <button id="cart-back" type="button" class="avatar-btn" aria-label="Back to menu">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
        <path d="M19 12H5"/>
        <path d="m12 19-7-7 7-7"/>
      </svg>
    </button>
    <h2 id="cart-title" class="cart-title">Your Order</h2>
    <span class="w-[46px] shrink-0" aria-hidden="true"></span>
  </header>

  <ul id="cart-items" class="cart-items"></ul>

  <footer class="cart-footer">
    <div class="cart-total">
      <span class="cart-total-label">Subtotal</span>
      <span id="cart-subtotal" class="cart-total-amount">&#8377;&nbsp;0</span>
    </div>

    <label class="summary-pill summary-pill--gold">
      <span class="summary-pill-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[18px] w-[18px]">
          <rect x="3" y="4" width="18" height="5" rx="2"/>
          <path d="M6 9v10"/>
          <path d="M18 9v10"/>
        </svg>
      </span>
      <input id="order-table" type="text" inputmode="numeric" autocomplete="off" placeholder="Table Number" aria-label="Table Number" />
    </label>

    <label class="summary-pill summary-pill--olive">
      <span class="summary-pill-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[18px] w-[18px]">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </span>
      <input id="order-notes" type="text" autocomplete="off" placeholder="Order Notes" aria-label="Order Notes" />
    </label>

    <button id="place-order-btn" type="button" class="w-full mt-3 py-4 rounded-full bg-navy text-white font-bold shadow-lg disabled:opacity-50 disabled:cursor-not-allowed" onclick="placeOrder()">Place Order · ₹ 0</button>
    <p id="order-status" class="text-center text-xs text-stone-500 mt-3" aria-live="polite"></p>
  </footer>
</aside>

<script>
let MENU_DATA = null;
let currentCategoryIndex = 0;

const currencyFormatter = new Intl.NumberFormat("en-IN", {
  style: "currency",
  currency: "INR",
  minimumFractionDigits: 0,
  maximumFractionDigits: 0
});

const TAG_STYLES = {
  "Chefs Recommendation": "border-brass/40 bg-brass/10 text-[#8A6A38]",
  "Non Vegetarian": "border-terra/30 bg-terra/[0.07] text-terra",
  "Contains Eggs": "border-[#C9971F]/40 bg-[#C9971F]/10 text-[#8F6A12]"
};
const TAG_DEFAULT_STYLE = "border-navy/20 bg-navy/[0.06] text-navy/70";


const FALLBACK_ITEM_IMAGE = "https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?q=80&w=400&auto=format&fit=crop";

function getItemImageUrl(item) { return item.image_url || FALLBACK_ITEM_IMAGE; }

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatPrice(amount) {
  return currencyFormatter.format(amount).replace("₹", "₹ ");
}

function buildPricingHtml(pricing) {
  const tiers = Object.entries(pricing || {});
  if (!tiers.length) return "";
  const blocks = tiers
    .map(function (pair) {
      var tier = pair[0];
      var amount = pair[1];
      return (
        '<div class="text-right">' +
        '<p class="whitespace-nowrap text-[15px] font-semibold tabular-nums text-gray-900">' +
        formatPrice(amount) +
        "</p>" +
        (tiers.length > 1 ? '<p class="mt-0.5 text-[9px] tracking-widest font-bold uppercase text-gray-400">' + escapeHtml(tier === "Non Veg" ? "Non-Veg" : tier) + "</p>" : "") +
        "</div>"
      );
    })
    .join("");
  return (
    '<div class="flex shrink-0 flex-col items-end justify-center gap-1.5">' +
    blocks +
    "</div>"
  );
}
function buildTagsHtml(tags) {
  if (!tags || !tags.length) return "";
  var chips = tags.map(function (tag) {
    var style = TAG_STYLES[tag] || TAG_DEFAULT_STYLE;
    return (
      '<span class="inline-flex items-center rounded-full border px-2.5 py-1 text-[9px] font-semibold uppercase tracking-[0.18em] ' +
      style +
      '">' +
      escapeHtml(tag) +
      "</span>"
    );
  });
  return '<div class="mt-2.5 flex flex-wrap gap-1.5">' + chips.join("") + "</div>";
}

function buildItemCard(item, index) {
  var safeName = escapeHtml(item.item_name);
  var tiers = Object.entries(item.pricing || {});
  var isSingleVariant = tiers.length === 1;
  
  var btnAttrs = 'data-item="' + escapeHtml(item.item_name) + '"';
  if (isSingleVariant) {
     btnAttrs += ' data-tier="' + escapeHtml(tiers[0][0]) + '" data-price="' + tiers[0][1] + '" data-single="true"';
  } else {
     btnAttrs += ' data-single="false"';
  }

  return (
    /* "menu-card" is kept alongside "menu-item" so the existing click,
       keyboard and search-filter bindings continue to work unchanged. */
    '<article class="menu-card menu-item rise" ' +
    'tabindex="0" role="button" aria-label="View details for ' +
    safeName +
    '" data-index="' +
    index +
    '" style="animation-delay:' +
    Math.min(index * 55, 440) +
    'ms">' +
    '<img class="menu-item-img" src="' +
    escapeHtml(getItemImageUrl(item)) +
    '" alt="' +
    safeName +
    '" loading="lazy" decoding="async" onerror="this.onerror=null; this.src=\'' +
    FALLBACK_ITEM_IMAGE +
    '\';" />' +
    '<div class="menu-item-info">' +
    '<h3 class="break-words">' +
    safeName +
    "</h3>" +
    '<p class="break-words">' +
    escapeHtml(item.description) +
    "</p>" +
    buildTagsHtml(item.tags) +
    "</div>" +
    '<div class="menu-item-action">' +
    buildPricingHtml(item.pricing) +
    '<button type="button" class="add-to-cart-btn" aria-label="Add to cart" onclick="event.stopPropagation(); handleAddToCartClick(this)" ' + btnAttrs + '>' +
    '+' +
    '</button>' +
    '</div>' +
    "</article>"
  );
}

function buildCategorySection(category) {
  var noteHtml = category.note
    ? '<p class="mt-1.5 font-display text-sm italic text-stone-500">' +
      escapeHtml(category.note) +
      "</p>"
    : "";
  var itemsHtml = category.items.map(buildItemCard).join("");
  return (
    '<section class="pt-2">' +
    '<div class="flex items-center gap-4">' +
    '<h2 class="font-display text-[26px] font-semibold uppercase tracking-[0.12em] text-navy">' +
    escapeHtml(category.category_name) +
    "</h2>" +
    '<span class="ornament-line flex-1" aria-hidden="true"></span>' +
    "</div>" +
    noteHtml +
    '<div class="mt-6 space-y-4">' +
    itemsHtml +
    "</div></section>"
  );
}

function buildLegend(legend) {
  if (!legend || !legend.length) return "";
  var rows = legend
    .map(function (entry) {
      return (
        '<li class="flex items-center gap-3">' +
        '<span class="block h-1.5 w-1.5 rotate-45 bg-brass" aria-hidden="true"></span>' +
        escapeHtml(entry) +
        "</li>"
      );
    })
    .join("");
  return (
    '<div class="rounded-2xl border border-navy/10 bg-white/70 p-5">' +
    '<h4 class="text-[10px] font-semibold uppercase tracking-[0.32em] text-stone-400">Legend</h4>' +
    '<ul class="mt-3.5 space-y-2.5 text-xs font-medium text-stone-600">' +
    rows +
    "</ul></div>"
  );
}

var itemModal = document.getElementById("item-modal");
var modalBackBtn = document.getElementById("modal-back");
var modalImage = document.getElementById("modal-image");
var modalName = document.getElementById("modal-name");
var modalTags = document.getElementById("modal-tags");
var modalPricing = document.getElementById("modal-pricing");
var modalInfoGrid = document.getElementById("modal-info-grid");
var lastFocusedCard = null;

function buildHeroTags(item) {
  var tiers = Object.keys(item.pricing || {});
  var chips = [];
  if (tiers.indexOf("Veg") > -1) {
    chips.push(["Veg", "olive"]);
  } else if (tiers.indexOf("Non Veg") > -1) {
    chips.push(["Non Veg", "terra"]);
  }
  (item.tags || []).forEach(function (tag) {
    if (tag === "Non Vegetarian") chips.push([tag, "terra"]);
    else if (tag === "Chefs Recommendation" || tag === "Contains Eggs") chips.push([tag, "gold"]);
    else chips.push([tag, "neutral"]);
  });
  if (!chips.length) return "";
  return chips
    .map(function (chip) {
      return '<span class="tag-chip tag-chip--' + chip[1] + '">' + escapeHtml(chip[0]) + "</span>";
    })
    .join("");
}

var currentItemName = null;

var chatHistory = document.getElementById("chat-history");
var chatForm = document.getElementById("chat-form");
var chatInput = document.getElementById("chat-input");
var chatSendBtn = document.getElementById("chat-send");
var promptRail = document.getElementById("prompt-rail");
var chatContextName = document.getElementById("chat-context-name");

var chatLog = [];
var lastChatDish = null;

function escapeChat(value) {
  return escapeHtml(value).replace(/\n/g, "<br>");
}

function appendUserBubble(text) {
  chatLog.push({ role: "user", content: text });
  var bubble = document.createElement("div");
  bubble.className = "bubble-row bubble-row--user";
  bubble.innerHTML =
    '<div class="bubble bubble--user">' +
    escapeChat(text) +
    "</div>";
  chatHistory.appendChild(bubble);
  scrollToLatest();
}

function appendAiBubble(text) {
  chatLog.push({ role: "assistant", content: text });
  var bubble = document.createElement("div");
  bubble.className = "bubble-row bubble-row--ai";
  bubble.innerHTML =
    '<div class="bubble bubble--ai">' +
    escapeChat(text) +
    "</div>";
  chatHistory.appendChild(bubble);
  scrollToLatest();
}

function scrollToLatest() {
  var scroller = chatHistory.closest(".overflow-y-auto");
  if (scroller) scroller.scrollTop = scroller.scrollHeight;
}

function appendThinkingIndicator() {
  var wrap = document.createElement("div");
  wrap.id = "chat-thinking";
  wrap.className = "bubble-row bubble-row--ai";
  wrap.innerHTML =
    '<div class="bubble bubble--ai italic">' +
    '<span class="thinking-dots" aria-hidden="true">' +
    '<span class="thinking-dot"></span>' +
    '<span class="thinking-dot"></span>' +
    '<span class="thinking-dot"></span>' +
    "</span>" +
    "The butler is thinking&hellip;" +
    "</div>";
  chatHistory.appendChild(wrap);
  scrollToLatest();
}

function removeThinkingIndicator() {
  var el = document.getElementById("chat-thinking");
  if (el) el.remove();
}

function resetChat(dishName) {
  if (lastChatDish === dishName) return;
  lastChatDish = dishName;
  chatLog = [];
  chatHistory.innerHTML = "";
  appendAiBubble(
    "Good evening! You're admiring the " +
      dishName +
      " — an excellent choice. Ask me about the heat, the portion, or what to sip alongside it."
  );
}

function setButlerBusy(busy) {
  chatSendBtn.disabled = busy;
  promptRail.classList.toggle("is-disabled", busy);
}

async function handleChatSubmit(event, presetText) {
  if (event) event.preventDefault();
  var userInput = String(presetText || chatInput.value || "").trim();
  if (!userInput) return;
  if (!currentItemName) {
    appendAiBubble("Please pick a dish from the menu first.");
    return;
  }
  if (chatSendBtn.disabled) return;

  var outgoingHistory = chatLog.slice(-8);
  appendUserBubble(userInput);
  if (!presetText) chatInput.value = "";
  appendThinkingIndicator();
  setButlerBusy(true);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        item_name: currentItemName,
        user_message: userInput,
        history: outgoingHistory
      })
    });
    const data = await response.json();
    removeThinkingIndicator();
    if (response.ok) {
      appendAiBubble(data.reply);
    } else {
      appendAiBubble(data.detail || "Sorry, something went wrong. Please try again.");
    }
  } catch (error) {
    removeThinkingIndicator();
    appendAiBubble("I could not reach the kitchen (backend). Is the server running?");
  } finally {
    setButlerBusy(false);
  }
}

promptRail.addEventListener("click", function (event) {
  var pill = event.target.closest("[data-prompt]");
  if (!pill) return;
  handleChatSubmit(null, pill.getAttribute("data-prompt"));
});

chatForm.addEventListener("submit", handleChatSubmit);

function updateCartBadge() {

  cartCountEl.classList.toggle("hidden", count === 0);

function updateCartSubtotal() {
  var total = cartState.reduce(function (sum, entry) {
    return sum + entry.price * entry.qty;
  }, 0);
  cartSubtotalEl.textContent = formatPrice(total);
  var placeBtn = document.getElementById("place-order-btn");
  if (placeBtn) {
    placeBtn.textContent = "Place Order · " + formatPrice(total);
    placeBtn.disabled = cartState.length === 0;
  }

function renderCart() {
  if (cartState.length) {
    cartItemsEl.innerHTML = cartState.map(buildCartItemHtml).join("");
  } else {
    cartItemsEl.innerHTML =
      '<li class="cart-empty">' + EMPTY_CART_ICON +
      "<h3>Your order is empty</h3>" +
      "<p>Add dishes from the menu to get started.</p></li>";

  updateCartSubtotal();
}

cartItemsEl.addEventListener("click", function (event) {
  var control = event.target.closest("[data-action]");
  if (!control) return;
  var index = parseInt(control.getAttribute("data-index"), 10);
  var entry = cartState[index];
  if (!entry) return;
  switch (control.getAttribute("data-action")) {
    case "inc":
      entry.qty += 1;
      break;
    case "dec":
      if (entry.qty <= 1) return;
      entry.qty -= 1;
      break;
    case "remove":
      cartState.splice(index, 1);
      break;
    default:
      return;
  }
  renderCart();
});

function openVariantSelector(itemName) {
  var item = findMenuItem(itemName);
  if (!item) return;
  currentVariantItem = item;
  
  document.getElementById("variant-title").textContent = item.item_name;
  
  var optionsHtml = "";
  var tiers = Object.entries(item.pricing || {});
  tiers.forEach(function(pair, idx) {
    var tier = pair[0];
    var price = pair[1];
    var isChecked = idx === 0 ? "checked" : "";
    optionsHtml += `
      <label class="flex items-center justify-between p-3 mb-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition-colors variant-label">
        <div class="flex items-center gap-3">
          <input type="radio" name="dish-variant" value="${escapeHtml(tier)}" data-price="${price}" class="w-5 h-5 text-navy focus:ring-navy border-gray-300" ${isChecked}>

        <span class="font-semibold text-gray-900">${formatPrice(price)}</span>
      </label>
    `;
  });

  var scrim = document.getElementById("variant-scrim");
  var sheet = document.getElementById("variant-sheet");
  
  scrim.classList.remove("opacity-0", "pointer-events-none");
  scrim.classList.add("opacity-100");
  
  sheet.classList.remove("translate-y-full");
  sheet.classList.add("translate-y-0");

function closeVariantSelector() {
  var scrim = document.getElementById("variant-scrim");
  var sheet = document.getElementById("variant-sheet");
  
  sheet.classList.remove("translate-y-0");
  sheet.classList.add("translate-y-full");
  
  scrim.classList.remove("opacity-100");
  scrim.classList.add("opacity-0", "pointer-events-none");
  
  currentVariantItem = null;
}

function confirmVariantSelection() {
  if (!currentVariantItem) return;
  
  var selectedRadio = document.querySelector('input[name="dish-variant"]:checked');
  if (!selectedRadio) return;
  
  var tier = selectedRadio.value;
  var price = parseFloat(selectedRadio.getAttribute("data-price"));
  
  addRawToCart(currentVariantItem.item_name, tier, price);
  
  closeVariantSelector();
  showToast("Added to cart!");
}

function addRawToCart(itemName, tier, price) {
  var menuItem = findMenuItem(itemName);
  if (!menuItem) return;
  
  var existing = null;
  for (var i = 0; i < cartState.length; i++) {
    if (cartState[i].item_name === itemName && cartState[i].tier === tier) {
      existing = cartState[i];
      break;
    }
  }
  
  if (existing) {
    existing.qty += 1;
  } else {
    cartState.push({
      item_name: menuItem.item_name,
      description: menuItem.description,
      tier: tier,
      price: price,
      qty: 1
    });
  }
  
  renderCart();
}

function addToCart(btn) {
  var itemName = btn.getAttribute("data-item");
  var tier = btn.getAttribute("data-tier");
  var price = parseFloat(btn.getAttribute("data-price"));
  
  addRawToCart(itemName, tier, price);
  
  if (btn.getAttribute("data-checking") === "true") return;
  var originalHtml = btn.innerHTML;
  var origClasses = btn.className;
  
  btn.setAttribute("data-checking", "true");
  btn.className = origClasses.replace("bg-sage-tint", "bg-sage").replace("text-sage-dark", "text-white");
  btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 text-white"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>';
  
  setTimeout(function() {
    btn.innerHTML = originalHtml;
    btn.className = origClasses;
    btn.removeAttribute("data-checking");
  }, 1000);
}

function showToast(msg) {

  toast.classList.remove("opacity-0", "pointer-events-none", "translate-y-[-20px]");

    toast.classList.remove("opacity-100", "translate-y-0");

  }, 2500);
}

var heroBanner = document.querySelector(".hero-banner");
if (heroBanner) {
  heroBanner.style.cursor = "pointer";
  heroBanner.addEventListener("click", function() {
    var butterChicken = findMenuItem("Butter Chicken Spaghetti");
    if (butterChicken) {
      openItemModal(this, butterChicken);
    }
  });
}

// Search Bar Logic
var searchInput = document.querySelector(".search-bar input");
if (searchInput) {
  searchInput.addEventListener("input", function(e) {
    var query = e.target.value.toLowerCase();
    var cards = document.querySelectorAll(".menu-card");
    cards.forEach(function(card) {
      var title = card.querySelector("h3").textContent.toLowerCase();
      var desc = card.querySelector("p").textContent.toLowerCase();
      if (title.indexOf(query) > -1 || desc.indexOf(query) > -1) {
        card.style.display = "";
      } else {
        card.style.display = "none";
      }
    });
  });
}


async function loadMenuData() {
  try {
    const res = await fetch('/api/menu');
    MENU_DATA = await res.json();
    renderDynamicCategoryRail();
    renderMenu(MENU_DATA);

  } catch(e) {
    console.error("Failed to load menu", e);
  }
}

function renderDynamicCategoryRail() {
  const rail = document.getElementById("category-rail");
  let html = '';
  MENU_DATA.categories.forEach((cat, idx) => {
    const active = idx === 0 ? 'is-active' : '';
    const aria = idx === 0 ? 'aria-current="true"' : '';
    html += `<button type="button" class="category-pill ${active}" ${aria} onclick="switchCategory(${idx}, this)">${escapeHtml(cat.category_name)}</button>`;
  });
  rail.innerHTML = html;
}

function switchCategory(idx, btn) {
  currentCategoryIndex = idx;
  document.querySelectorAll(".category-pill").forEach(p => {
    p.classList.remove("is-active");
    p.removeAttribute("aria-current");
  });
  btn.classList.add("is-active");
  btn.setAttribute("aria-current", "true");
  
  if (searchInput) {
    searchInput.value = "";
    searchInput.dispatchEvent(new Event('input'));
  }
  renderMenu(MENU_DATA);

}

// Override renderMenu to only render current category
function renderMenu(data) {
  var root = document.getElementById("menu-root");
  root.innerHTML =
    '<div class="mb-2 flex items-center justify-between">' +
    '<p class="text-[10px] font-semibold uppercase tracking-[0.4em] text-stone-400">' +
    escapeHtml(data.menu_section) +
    "</p></div>" +
    buildCategorySection(data.categories[currentCategoryIndex]);

  Array.prototype.forEach.call(root.querySelectorAll(".menu-card"), function (card) {
    card.addEventListener("click", function () {
      var item = data.categories[currentCategoryIndex].items[parseInt(card.getAttribute("data-index"), 10)];
      openItemModal(card, item);
    });
    card.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        var item = data.categories[currentCategoryIndex].items[parseInt(card.getAttribute("data-index"), 10)];
        openItemModal(card, item);
      }
    });
  });

  document.getElementById("legend-root").innerHTML = buildLegend(data.legend);
}

window.addEventListener('DOMContentLoaded', function() {
  var splash = document.getElementById('splash-screen');
  var logoWrapper = document.getElementById('splash-logo-wrapper');
  var appShell = document.querySelector('.app-shell');
  setTimeout(function() { if (logoWrapper) logoWrapper.classList.add('animate-splash'); }, 150);
  setTimeout(function() {
    if (splash) splash.classList.add('hide-splash');
    if (appShell) appShell.classList.add('show-app');
    setTimeout(function() { if (splash) splash.remove(); }, 1000);
  }, 1800);
  
  loadMenuData(); // Fetch Data on load!
});
</script>
